services:
  db:
    image: postgres:17
    container_name: eemw-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: eemw_user
      POSTGRES_PASSWORD: eemw_local_password
      POSTGRES_DB: eemw_documents

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  postgres_data:
